<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to Reveal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: 
                linear-gradient(rgba(244, 197, 66, 0.92), rgba(232, 155, 60, 0.92), rgba(139, 0, 0, 0.92)),
                url('background.png') center/contain no-repeat fixed;
            background-color: #f4c542;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2c1810;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
            color: #8B0000;
            font-weight: bold;
        }

        .congrats {
            font-size: 3em;
            color: #8B0000;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: celebrate 2s ease-in-out;
        }

        @keyframes celebrate {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .trophy {
            font-size: 4em;
            margin: 20px 0;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .time-unit {
            background: rgba(139, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            min-width: 120px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 3px solid #f4c542;
        }

        .time-value {
            font-size: 3em;
            font-weight: bold;
            display: block;
            line-height: 1;
            color: #f4c542;
        }

        .time-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #f4c542;
        }

        .message {
            font-size: 1.2em;
            margin-top: 30px;
            color: #2c1810;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.3);
        }

        .video-container {
            display: none;
            margin-top: 30px;
        }

        .video-container.active {
            display: block;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        iframe {
            width: 100%;
            max-width: 800px;
            height: 450px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .expired-message {
            display: none;
            font-size: 1.5em;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }
            
            .time-unit {
                min-width: 80px;
                padding: 15px;
            }
            
            .time-value {
                font-size: 2em;
            }
            
            iframe {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="trophy">🏆</div>
        <h1 class="congrats">YOU DID IT!</h1>
        <h1 id="title">Your Reward is Coming Soon...</h1>
        
        <div id="countdownSection">
            <div class="countdown">
                <div class="time-unit">
                    <span class="time-value" id="days">00</span>
                    <span class="time-label">Days</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="hours">00</span>
                    <span class="time-label">Hours</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="minutes">00</span>
                    <span class="time-label">Minutes</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="seconds">00</span>
                    <span class="time-label">Seconds</span>
                </div>
            </div>
            <p class="message" id="message">Your prize will be revealed soon! 🎉</p>
        </div>

        <div class="video-container" id="videoContainer">
            <iframe id="videoFrame" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>

        <div class="expired-message" id="expiredMessage">
            This reveal has already happened. Check back for future announcements!
        </div>
    </div>

    <script>
        // ========================================
        // CONFIGURATION - EDIT THESE VALUES
        // ========================================
        
        // Set your target date and time (Year, Month (0-11), Day, Hour, Minute, Second)
        // Example: January 20, 2026 at 3:00 PM = new Date(2026, 0, 20, 15, 0, 0)
        // FOR TESTING: Set this to a past date to immediately show the video
        const TARGET_DATE = new Date(2026, 0, 26, 0, 0, 0);
        
        // Your YouTube video ID (the part after ?v= in the URL)
        // Example: If URL is https://www.youtube.com/watch?v=dQw4w9WgXcQ
        // Then VIDEO_ID is: dQw4w9WgXcQ
        // NOTE: Make sure the video allows embedding! Some videos have embedding disabled.
        // Test video ID (embeddable): jNQXAC9IVRw
        const VIDEO_ID = 'jNQXAC9IVRw';
        
        // Optional: Customize text
        const TITLE_TEXT = 'Your Reward is Coming Soon...';
        const MESSAGE_TEXT = "Your prize will be revealed soon! 🎉";
        const REVEAL_TITLE = '💖🎁 Happy 50th Birthday, Adi! 🎂💖';
        
        // ========================================
        // END CONFIGURATION
        // ========================================

        document.getElementById('title').textContent = TITLE_TEXT;
        document.getElementById('message').textContent = MESSAGE_TEXT;

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = TARGET_DATE.getTime() - now;

            if (distance < 0) {
                // Countdown finished - show video
                document.getElementById('countdownSection').style.display = 'none';
                document.getElementById('title').textContent = REVEAL_TITLE;
                document.getElementById('videoContainer').classList.add('active');
                document.getElementById('videoFrame').src = `https://www.youtube-nocookie.com/embed/${VIDEO_ID}?rel=0&modestbranding=1`;
                return;
            }

            // Calculate time units
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Update display
            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        // Check if the target date has already passed on page load
        if (new Date().getTime() > TARGET_DATE.getTime()) {
            document.getElementById('countdownSection').style.display = 'none';
            document.getElementById('title').textContent = REVEAL_TITLE;
            document.getElementById('videoContainer').classList.add('active');
            document.getElementById('videoFrame').src = `https://www.youtube-nocookie.com/embed/${VIDEO_ID}?rel=0&modestbranding=1`;
        } else {
            // Update countdown immediately and then every second
            updateCountdown();
            setInterval(updateCountdown, 1000);
        }
    </script>
</body>
</html>
